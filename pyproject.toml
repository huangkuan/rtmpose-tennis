[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtmpose-tennis"
version = "0.1.0"
description = "Real-time tennis player keypoint detection with RTMPose"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.24,<2",
  "torch==2.1.2",
  "torchvision==0.16.2",
  "opencv-python>=4.8,<5",
  "mmengine>=0.8,<1",
  "mmcv>=2.0.1,<2.2.0",
  "mmpose>=1.3,<2",
  "mmdet>=3.2,<4",
]

[project.scripts]
rtmpose-tennis = "rtmpose_tennis.app:main"

[tool.setuptools.packages.find]
include = ["rtmpose_tennis*"]
